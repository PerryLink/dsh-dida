<path d="M730 265h68" fill="none" stroke="#57606a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M796 260l8 5-8 5" fill="none" stroke="#57606a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M965 320v28" fill="none" stroke="#57606a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M960 346l5 8 5-8" fill="none" stroke="#57606a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="560" fill="#57606a" font-family="ui-monospace,monospace" font-size="13">protectedTaskIds · refuse before wire · reads = cloud state · writes = cloud account</text>
</svg>
