<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="dsh-dida architecture: session header and ticktick_* tools feed TicktickService, which calls the official TickTick MCP endpoint; the configuration card writes the profile row">
<title>dsh-dida architecture</title>
<rect width="1200" height="580" rx="18" fill="#ffffff"/>
<text x="60" y="62" fill="#1f2328" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="700">dsh-dida</text>
<text x="60" y="94" fill="#57606a" font-family="ui-monospace,monospace" font-size="16">TickTick / Dida365 task bridge · official MCP endpoint · panel + 11 tools</text>
<line x1="60" y1="116" x2="1140" y2="116" stroke="#d0d7de"/>
<rect x="60" y="150" width="300" height="84" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="210" y="182" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700">session header</text>
<text x="210" y="206" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">action: ticktick</text>
<rect x="60" y="270" width="300" height="84" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="210" y="302" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700">ticktick_* tools</text>
<text x="210" y="326" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">ctx.tools</text>
<rect x="60" y="390" width="300" height="84" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="210" y="422" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700">plugins.row.config</text>
<text x="210" y="446" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">ctx.configForms</text>
<rect x="470" y="210" width="260" height="140" rx="14" fill="#f6f8fa" stroke="#4B67B4" stroke-width="2"/>
<text x="600" y="242" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700">TicktickService</text>
<text x="600" y="266" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">Remote namespace: ticktick</text>
<text x="600" y="288" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">ctx.remote.ticktick.*</text>
<text x="600" y="310" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">tools/call</text>
<rect x="810" y="210" width="310" height="110" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="965" y="242" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700">MCP client</text>
<text x="965" y="266" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">streamable HTTP</text>
<text x="965" y="288" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">session id · Retry-After</text>
<rect x="810" y="360" width="310" height="70" rx="14" fill="#f6f8fa" stroke="#16a34a" stroke-width="2"/>
<text x="965" y="392" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700">https://mcp.dida365.com</text>
<text x="965" y="416" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">official TickTick MCP</text>
<rect x="470" y="420" width="260" height="90" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 5"/>
<text x="600" y="452" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700">profile row: ticktick</text>
<text x="600" y="476" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">Volatile Config</text>
<text x="600" y="498" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">no restart</text>
<rect x="810" y="450" width="310" height="80" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="965" y="482" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700">token</text>
<text x="965" y="506" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">token &gt; DIDA365_TOKEN &gt; tokenFile</text>
<text x="965" y="528" fill="#57606a" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">re-read per request · 401 → reset</text>
