<text x="350" y="366" font-size="12" fill="#d7def0" font-family="'Consolas','Cascadia Mono',monospace">initialize + tools/list → resolver</text>
<text x="350" y="385" font-size="12" fill="#9aa7c2" font-family="'Microsoft YaHei','Segoe UI',sans-serif">pins | pattern · client cached per token</text>
<text x="350" y="402" font-size="12" fill="#9aa7c2" font-family="'Microsoft YaHei','Segoe UI',sans-serif">token changed / bootFailed → rebuild</text>
