<text x="350" y="302" font-size="12" fill="#d7def0" font-family="'Consolas','Cascadia Mono',monospace">secret &gt; DIDA365_TOKEN &gt; tokenFile</text>
<text x="350" y="317" font-size="11.5" fill="#9aa7c2" font-family="'Microsoft YaHei','Segoe UI',sans-serif">null → ticktick/no-token · 401 → reset()</text>
