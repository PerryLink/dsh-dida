<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="fig-title">
<title id="fig-title">dsh-dida — one guarded wire: three surfaces, one remote namespace, one MCP endpoint</title>
<desc>Three surfaces (session-header panel, eleven tools, config card that writes the profile row) fan into TicktickService, whose three gates are protectedTaskIds, a per-request token resolve and a lazy client bootstrap; the single wire leaves for mcp.dida365.com and the TickTick cloud. Two loops stay attached: the measured setDue detour and the 401 reset back into the token gate.</desc>
