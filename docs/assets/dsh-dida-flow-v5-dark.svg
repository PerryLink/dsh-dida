<text x="350" y="249" font-size="11.5" fill="#9aa7c2" font-family="'Consolas','Cascadia Mono',monospace">→ ticktick/protected</text>
<rect x="336" y="260" width="324" height="62" rx="14" fill="#202a41"/>
