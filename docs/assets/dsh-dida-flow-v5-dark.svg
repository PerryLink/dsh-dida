<text x="742" y="194" font-size="11.5" fill="#9aa7c2" font-family="'Consolas','Cascadia Mono',monospace">initialize → session id + protocol version</text>
<text x="742" y="214" font-size="11.5" fill="#9aa7c2" font-family="'Consolas','Cascadia Mono',monospace">tools/list → raw tool names</text>
<text x="742" y="234" font-size="11.5" fill="#9aa7c2" font-family="'Consolas','Cascadia Mono',monospace">429 → Retry-After ×1</text>
<text x="742" y="254" font-size="11.5" fill="#9aa7c2" font-family="'Consolas','Cascadia Mono',monospace">isError → throw</text>
<text x="742" y="274" font-size="11.5" fill="#9aa7c2" font-family="'Consolas','Cascadia Mono',monospace">timeout: toolCallTimeoutMs</text>
